<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <title>Yuri Coimbra Finance</title>
    <link rel="icon" href="logo-yc.svg" />
    <link rel="stylesheet" href="styles.css?v=7" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="splash-on">
    <div class="splash" id="splash">
      <img class="splash-mark" src="logo-yc.svg" alt="YC" />
      <p>YURI COIMBRA</p>
      <em>FINANCE</em>
    </div>
    <header class="topbar">
      <div class="brand">
        <img src="logo-yc.svg" alt="" />
        <div><strong>YURI COIMBRA</strong><span>Finance</span></div>
      </div>
      <button type="button" id="refresh" class="icon-btn" aria-label="Atualizar">↻</button>
    </header>
    <label class="search"><input id="q" type="search" placeholder="Buscar ticker" autocomplete="off" /></label>
    <nav class="tabs">
      <button type="button" class="on" data-tab="agro">Agro</button>
      <button type="button" data-tab="b3">B3</button>
      <button type="button" data-tab="global">Global</button>
      <button type="button" data-tab="fx">Câmbio</button>
    </nav>
    <p class="pulse" id="pulse">Abrindo mesa</p>
    <main id="list" class="list"></main>
    <nav class="dock">
      <button type="button" class="on" data-tab="agro">Agro</button>
      <button type="button" data-tab="b3">B3</button>
      <button type="button" data-tab="global">Global</button>
    </nav>
    <script src="universe.js?v=7"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
